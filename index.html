<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quelques questions pour toi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Bricolage+Grotesque:wght@400;500;700&display=swap">
<script>
/* =====================================================================
   TES QUESTIONS — modifie-les ici
   type: "texte" (réponse courte), "long" (paragraphe),
         "choix" (une option parmi plusieurs), "note" (de 1 à 10),
         "message" (juste du texte, sans réponse),
         "ouinon" (boutons Oui / Non ; si Oui, une case à remplir)
   placeholder (facultatif) : le texte gris affiché dans la case vide
   ===================================================================== */
const EMAIL = "haestesko@gmail.com"; // ← adresse qui reçoit les réponses par mail
const PRENOM = "toi"; // ← son prénom, s'affiche sur la première carte

const INTRO = "Françoise…"; // ← la toute première page

const TITRE = "Pardon."; // ← le message de la page « Pardon. »
const MESSAGE = [
  "Je t'ai mal parlé par msg et tu ne méritais pas ça. Je ne cherche pas à me justifier : j'ai eu tort, et je le regrette sincèrement.",
];

const CITATION = "Un seul être vous manque, et tout est dépeuplé"; // ← la dernière page, après l'envoi
const AUTEUR = "Lamartine";

const QUESTIONS = [
  { type: "message", q: "Aujourd'hui je ne veux pas de msg" },
  { type: "message", q: "J'ai menti sur mon âge et je comprends que pour toi la situation soit ambiguë" },
  { type: "message", q: "Je te demande pardon aussi pour ça" },
  { type: "message", q: "Je m'attendais tout simplement pas à tomber sur quelqu'un d'aussi exceptionnelle et là, boom, dans ma tête plus rien fonctionne" },
  { type: "message", q: "Car la vie est faite d'imprévus, c'est ça qui la rend plus belle" },
  { type: "message", q: "Venons-en au but" },
  { type: "ouinon", q: "Si tu acceptes de me dire ton heure d'arrivée, je saurai que tu veux que je te retrouve, sinon je te laisserai tranquille et tu entendras plus parler de moi",
    placeholder: "Ton heure d'arrivée" },
];
</script>
<style>
/* Layout : une seule carte sur un fond lilas, texte centré, une question à la fois */
:root {
  --bg: #efe6f3;
  --bg-2: #e3d3ec;
  --card: #fffafc;
  --ink: #2e1630;
  --muted: #6b5671;
  --accent: #d6336c;
  --accent-soft: #fbe1ea;
  --line: #e6d9e9;
  --display: "Instrument Serif", Georgia, serif;
  --body: "Bricolage Grotesque", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--body);
  font-size: 16px;
  color: var(--ink);
  background: radial-gradient(120% 80% at 50% 0%, var(--bg-2), var(--bg) 60%);
  background-color: var(--bg);
  display: grid;
  place-items: center;
  padding-block: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.card {
  width: 100%;
  max-width: 440px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 22px;
  box-shadow: 0 18px 50px -20px rgba(46, 22, 48, .35);
  padding: 28px 24px 22px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  min-height: 360px;
  text-align: center;
}
.count { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.count:empty { display: none; }
h1, h2 {
  font-family: var(--display);
  font-weight: 400;
  line-height: 1.1;
  margin: 0;
  text-wrap: balance;
}
h1 { font-size: 42px; }
h2 { font-size: 30px; }
p { margin: 0; line-height: 1.5; color: var(--muted); }
.msg { color: var(--ink); font-size: 17px; }
.quote { font-style: italic; }
.note { flex: 1; font-size: 13px; }
.body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; }
.step { animation: in .35s ease both; display: flex; flex-direction: column; gap: 18px; }
@keyframes in { from { opacity: .3; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .step { animation: none; } }

input[type=text], textarea {
  width: 100%;
  font: inherit;
  text-align: center;
  color: var(--ink);
  background: #fff;
  border: 1.5px solid var(--line);
  border-radius: 14px;
  padding: 14px 16px;
  outline: none;
  transition: border-color .2s;
}
textarea { min-height: 130px; resize: vertical; }
input[type=text]:focus, textarea:focus { border-color: var(--accent); }

.options { display: flex; flex-direction: column; gap: 10px; }
.opt {
  font: inherit; text-align: center; color: var(--ink);
  background: #fff; border: 1.5px solid var(--line); border-radius: 14px;
  padding: 13px 16px; cursor: pointer; transition: all .15s;
}
.opt:hover { border-color: var(--accent); }
.opt.sel { background: var(--accent-soft); border-color: var(--accent); font-weight: 500; }
.options.duo { flex-direction: row; }
.duo .opt { flex: 1; }

.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.scale button {
  font: inherit; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink);
  aspect-ratio: 1; max-width: 100%; border-radius: 50%;
  border: 1.5px solid var(--line); background: #fff; cursor: pointer; transition: all .15s;
}
.scale button.sel { background: var(--accent); border-color: var(--accent); color: #fff; }
.scale-legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }

.nav { display: flex; gap: 10px; }
.btn {
  font: inherit; font-weight: 500; border-radius: 999px; padding: 13px 22px; cursor: pointer;
  border: 1.5px solid var(--ink); background: var(--ink); color: var(--card); flex: 1;
  transition: opacity .2s, transform .1s;
}
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .35; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); flex: 0 0 auto; }
.btn:focus-visible, .opt:focus-visible, .scale button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

</style>
</head>
<body>
<main class="card" id="card">
  <span class="count" id="count">Pour toi</span>
  <div class="body" id="body"></div>
  <div class="nav" id="nav"></div>
</main>

<script>
const answers = QUESTIONS.map(Q => Q.type === "ouinon" ? { choix: "", heure: "" } : "");
let i = -2; // -2 = toute première page, -1 = page « Pardon. »

const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, kids = []) => {
  const n = Object.assign(document.createElement(tag), props);
  kids.forEach(k => n.append(k));
  return n;
};

// Le bouton Suivant / Envoyer ne s'active que quand la page est remplie
function ready(Q, a) {
  if (Q.type === "message") return true;
  if (Q.type === "ouinon") return a.choix === "Non" || (a.choix === "Oui" && a.heure.trim() !== "");
  return String(a).trim() !== "";
}

function render() {
  const body = $("body"), nav = $("nav");
  body.replaceChildren();
  nav.replaceChildren();

  if (i === -2) {
    $("count").textContent = "";
    body.append(el("div", { className: "step" }, [el("h1", { textContent: INTRO })]));
    nav.append(el("button", { className: "btn", textContent: "Continuer", onclick: () => { i = -1; render(); } }));
    return;
  }

  if (i === -1) {
    $("count").textContent = "Pour " + PRENOM;
    body.append(el("div", { className: "step" }, [
      el("h1", { textContent: TITRE }),
      ...MESSAGE.map(t => el("p", { className: "msg", textContent: t })),
    ]));
    nav.append(el("button", { className: "btn", textContent: "Continuer", onclick: () => { i = 0; render(); } }));
    return;
  }

  const Q = QUESTIONS[i];
  $("count").textContent = "";
  const step = el("div", { className: "step" }, [el("h2", { textContent: Q.q })]);
  const next = el("button", { className: "btn", textContent: i === QUESTIONS.length - 1 ? "Envoyer" : "Suivant" });
  const update = () => { next.disabled = !ready(Q, answers[i]); };

  if (Q.type === "texte" || Q.type === "long") {
    const input = Q.type === "long"
      ? el("textarea", { id: "a" + i, placeholder: Q.placeholder || "Écris ici…" })
      : el("input", { id: "a" + i, type: "text", placeholder: Q.placeholder || "Écris ici…" });
    input.value = answers[i];
    input.oninput = () => { answers[i] = input.value; update(); };
    if (Q.type === "texte") input.onkeydown = (e) => { if (e.key === "Enter" && !next.disabled) next.click(); };
    step.append(input);
    setTimeout(() => input.focus(), 50);
  } else if (Q.type === "choix") {
    const box = el("div", { className: "options" });
    Q.options.forEach(o => {
      const b = el("button", { className: "opt" + (answers[i] === o ? " sel" : ""), textContent: o });
      b.onclick = () => {
        answers[i] = o;
        box.querySelectorAll(".opt").forEach(x => x.classList.toggle("sel", x === b));
        update();
      };
      box.append(b);
    });
    step.append(box);
  } else if (Q.type === "note") {
    const box = el("div", { className: "scale" });
    for (let n = 1; n <= 10; n++) {
      const b = el("button", { textContent: n, className: answers[i] === n ? "sel" : "" });
      b.setAttribute("aria-label", n + " sur 10");
      b.onclick = () => {
        answers[i] = n;
        box.querySelectorAll("button").forEach(x => x.classList.toggle("sel", x === b));
        update();
      };
      box.append(b);
    }
    step.append(box, el("div", { className: "scale-legend" }, [el("span", { textContent: "un peu" }), el("span", { textContent: "énormément" })]));
  } else if (Q.type === "ouinon") {
    const a = answers[i];
    const box = el("div", { className: "options duo" });
    const input = el("input", { id: "a" + i, type: "text", placeholder: Q.placeholder || "Écris ici…" });
    input.value = a.heure;
    input.hidden = a.choix !== "Oui";
    input.oninput = () => { a.heure = input.value; update(); };
    input.onkeydown = (e) => { if (e.key === "Enter" && !next.disabled) next.click(); };
    ["Oui", "Non"].forEach(o => {
      const b = el("button", { className: "opt" + (a.choix === o ? " sel" : ""), textContent: o });
      b.onclick = () => {
        a.choix = o;
        box.querySelectorAll(".opt").forEach(x => x.classList.toggle("sel", x === b));
        input.hidden = o !== "Oui";
        if (o === "Oui") input.focus();
        update();
      };
      box.append(b);
    });
    step.append(box, input);
  }

  body.append(step);
  const back = el("button", { className: "btn ghost", textContent: "←", onclick: () => { i--; render(); } });
  back.setAttribute("aria-label", "Question précédente");
  next.onclick = () => { if (i === QUESTIONS.length - 1) send(); else { i++; render(); } };
  nav.append(back, next);
  update();
}

async function send() {
  const body = $("body"), nav = $("nav");
  nav.replaceChildren();
  body.replaceChildren(el("div", { className: "step" }, [el("h2", { textContent: "Envoi en cours…" })]));

  let ok = false;
  if (EMAIL) {
    const payload = { _subject: "Ses réponses ♥", _template: "box" };
    let n = 0;
    QUESTIONS.forEach((Q, k) => {
      if (Q.type === "message") return;
      let a = answers[k];
      if (Q.type === "ouinon") {
        payload._subject = "Sa réponse : " + a.choix; // Oui ou Non directement dans l'objet du mail
        a = a.choix === "Oui" ? "Oui — " + a.heure : "Non";
      }
      payload[`${++n}. ${Q.q}`] = a;
    });
    try {
      const r = await fetch("https://formsubmit.co/ajax/" + EMAIL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify(payload),
      });
      // FormSubmit répond 200 même quand le formulaire n'est pas encore activé
      const data = await r.json().catch(() => ({}));
      ok = r.ok && String(data.success) === "true";
    } catch (e) { ok = false; }
  }
  if (ok) done(); else failed();
}

function done() {
  $("count").textContent = "";
  $("body").replaceChildren(el("div", { className: "step" }, [
    el("p", { className: "msg", textContent: AUTEUR + " a dit un jour :" }),
    el("h2", { className: "quote", textContent: "« " + CITATION + " »" }),
  ]));
  $("nav").replaceChildren(el("p", { className: "note", textContent: "Ta réponse a bien été envoyée." }));
}

// Les réponses restent en mémoire : « Réessayer » renvoie les mêmes
function failed() {
  $("body").replaceChildren(el("div", { className: "step" }, [
    el("h2", { textContent: "L'envoi n'a pas marché" }),
    el("p", { textContent: "Vérifie ta connexion internet, puis réessaie." }),
  ]));
  $("nav").replaceChildren(el("button", { className: "btn", textContent: "Réessayer", onclick: send }));
}

render();
</script>
</body>
</html>
