<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quelques questions pour toi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Bricolage+Grotesque:wght@400;500;700&display=swap">
<script>
/* =====================================================================
   TES QUESTIONS — modifie-les ici
   type: "texte" (réponse courte), "long" (paragraphe),
         "choix" (une option parmi plusieurs), "note" (de 1 à 10)
   ===================================================================== */
const EMAIL = "haestesko@gmail.com"; // ← adresse qui reçoit les réponses par mail
const PRENOM = "toi"; // ← son prénom, s'affiche sur la première carte

const QUESTIONS = [
  { type: "texte", q: "Quel est ton meilleur souvenir avec moi ?" },
  { type: "note",  q: "De 1 à 10, à quel point tu es heureuse en ce moment ?" },
  { type: "choix", q: "Notre prochain rendez-vous idéal, ce serait…",
    options: ["Un resto en amoureux", "Une soirée film sous la couette", "Un week-end surprise", "Une balade au coucher du soleil"] },
  { type: "texte", q: "Un plat que tu voudrais que j'apprenne à cuisiner pour toi ?" },
  { type: "choix", q: "Qui dit « je t'aime » en premier le plus souvent ?",
    options: ["Moi", "Toi", "Égalité parfaite"] },
  { type: "texte", q: "Décris-moi en un seul mot." },
  { type: "long",  q: "Un petit message pour moi ?" },
];
</script>
<style>
/* Layout : une seule carte centrée sur un fond lilas, une question à la fois */
:root {
  --bg: #efe6f3;
  --bg-2: #e3d3ec;
  --card: #fffafc;
  --ink: #2e1630;
  --muted: #7b6680;
  --accent: #d6336c;
  --accent-soft: #fbe1ea;
  --line: #e6d9e9;
  --display: "Instrument Serif", Georgia, serif;
  --body: "Bricolage Grotesque", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--body);
  font-size: 16px;
  color: var(--ink);
  background: radial-gradient(120% 80% at 50% 0%, var(--bg-2), var(--bg) 60%);
  background-color: var(--bg);
  display: grid;
  place-items: center;
  padding-block: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.card {
  width: 100%;
  max-width: 440px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 22px;
  box-shadow: 0 18px 50px -20px rgba(46, 22, 48, .35);
  padding: 28px 24px 22px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  min-height: 360px;
}
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.count { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
.dots { display: flex; gap: 5px; }
.dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--line); transition: background .3s; }
.dots span.on { background: var(--accent); }
h1, h2 {
  font-family: var(--display);
  font-weight: 400;
  line-height: 1.1;
  margin: 0;
  text-wrap: balance;
}
h1 { font-size: 42px; }
h1 em { color: var(--accent); }
h2 { font-size: 30px; }
p { margin: 0; line-height: 1.5; color: var(--muted); }
.body { flex: 1; display: flex; flex-direction: column; gap: 16px; }
.step { animation: in .35s ease both; display: flex; flex-direction: column; gap: 18px; }
@keyframes in { from { opacity: .3; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .step { animation: none; } }

input[type=text], textarea {
  width: 100%;
  font: inherit;
  color: var(--ink);
  background: #fff;
  border: 1.5px solid var(--line);
  border-radius: 14px;
  padding: 14px 16px;
  outline: none;
  transition: border-color .2s;
}
textarea { min-height: 130px; resize: vertical; }
input[type=text]:focus, textarea:focus { border-color: var(--accent); }

.options { display: flex; flex-direction: column; gap: 10px; }
.opt {
  font: inherit; text-align: left; color: var(--ink);
  background: #fff; border: 1.5px solid var(--line); border-radius: 14px;
  padding: 13px 16px; cursor: pointer; transition: all .15s;
}
.opt:hover { border-color: var(--accent); }
.opt.sel { background: var(--accent-soft); border-color: var(--accent); font-weight: 500; }

.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.scale button {
  font: inherit; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink);
  aspect-ratio: 1; max-width: 100%; border-radius: 50%;
  border: 1.5px solid var(--line); background: #fff; cursor: pointer; transition: all .15s;
}
.scale button.sel { background: var(--accent); border-color: var(--accent); color: #fff; }
.scale-legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }

.nav { display: flex; gap: 10px; }
.btn {
  font: inherit; font-weight: 500; border-radius: 999px; padding: 13px 22px; cursor: pointer;
  border: 1.5px solid var(--ink); background: var(--ink); color: var(--card); flex: 1;
  transition: opacity .2s, transform .1s;
}
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .35; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); flex: 0 0 auto; }
.btn:focus-visible, .opt:focus-visible, .scale button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.heart { font-size: 46px; color: var(--accent); line-height: 1; }
</style>
</head>
<body>
<main class="card" id="card">
  <div class="top">
    <span class="count" id="count">Pour toi</span>
    <div class="dots" id="dots"></div>
  </div>
  <div class="body" id="body"></div>
  <div class="nav" id="nav"></div>
</main>

<script>
const answers = QUESTIONS.map(() => "");
let i = -1; // -1 = écran d'accueil

const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, kids = []) => {
  const n = Object.assign(document.createElement(tag), props);
  kids.forEach(k => n.append(k));
  return n;
};

function dots() {
  $("dots").replaceChildren(...QUESTIONS.map((_, k) => el("span", { className: k <= i ? "on" : "" })));
}

function render() {
  dots();
  const body = $("body"), nav = $("nav");
  body.replaceChildren();
  nav.replaceChildren();

  if (i === -1) {
    $("count").textContent = "Pour " + PRENOM;
    body.append(el("div", { className: "step" }, [
      el("div", { className: "heart", textContent: "♥" }),
      el("h1", { innerHTML: "J'ai quelques <em>questions</em> pour toi…" }),
      el("p", { textContent: "Réponds avec ton cœur, il n'y a pas de mauvaise réponse. Ça prend deux minutes." }),
    ]));
    nav.append(el("button", { className: "btn", textContent: "On commence", onclick: () => { i = 0; render(); } }));
    return;
  }

  const Q = QUESTIONS[i];
  $("count").textContent = `Question ${i + 1} / ${QUESTIONS.length}`;
  const step = el("div", { className: "step" }, [el("h2", { textContent: Q.q })]);
  const next = el("button", { className: "btn", textContent: i === QUESTIONS.length - 1 ? "Envoyer ♥" : "Suivant" });
  const update = () => { next.disabled = !String(answers[i]).trim(); };

  if (Q.type === "texte" || Q.type === "long") {
    const input = Q.type === "long"
      ? el("textarea", { id: "a" + i, placeholder: "Écris ici…" })
      : el("input", { id: "a" + i, type: "text", placeholder: "Écris ici…" });
    input.value = answers[i];
    input.oninput = () => { answers[i] = input.value; update(); };
    if (Q.type === "texte") input.onkeydown = (e) => { if (e.key === "Enter" && !next.disabled) next.click(); };
    step.append(input);
    setTimeout(() => input.focus(), 50);
  } else if (Q.type === "choix") {
    const box = el("div", { className: "options" });
    Q.options.forEach(o => {
      const b = el("button", { className: "opt" + (answers[i] === o ? " sel" : ""), textContent: o });
      b.onclick = () => {
        answers[i] = o;
        box.querySelectorAll(".opt").forEach(x => x.classList.toggle("sel", x === b));
        update();
      };
      box.append(b);
    });
    step.append(box);
  } else if (Q.type === "note") {
    const box = el("div", { className: "scale" });
    for (let n = 1; n <= 10; n++) {
      const b = el("button", { textContent: n, className: answers[i] === n ? "sel" : "" });
      b.setAttribute("aria-label", n + " sur 10");
      b.onclick = () => {
        answers[i] = n;
        box.querySelectorAll("button").forEach(x => x.classList.toggle("sel", x === b));
        update();
      };
      box.append(b);
    }
    step.append(box, el("div", { className: "scale-legend" }, [el("span", { textContent: "un peu" }), el("span", { textContent: "énormément" })]));
  }

  body.append(step);
  const back = el("button", { className: "btn ghost", textContent: "←", onclick: () => { i--; render(); } });
  back.setAttribute("aria-label", "Question précédente");
  next.onclick = () => { if (i === QUESTIONS.length - 1) send(); else { i++; render(); } };
  nav.append(back, next);
  update();
}

async function send() {
  const body = $("body"), nav = $("nav");
  nav.replaceChildren();
  body.replaceChildren(el("div", { className: "step" }, [el("h2", { textContent: "Envoi en cours…" })]));

  let ok = false;
  if (EMAIL) {
    const payload = { _subject: "Ses réponses ♥", _template: "box" };
    QUESTIONS.forEach((Q, k) => { payload[`${k + 1}. ${Q.q}`] = answers[k]; });
    try {
      const r = await fetch("https://formsubmit.co/ajax/" + EMAIL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify(payload),
      });
      // FormSubmit répond 200 même quand le formulaire n'est pas encore activé
      const data = await r.json().catch(() => ({}));
      ok = r.ok && String(data.success) === "true";
    } catch (e) { ok = false; }
  }
  if (ok) done(); else failed();
}

function done() {
  $("count").textContent = "Merci";
  i = QUESTIONS.length;
  dots();
  $("body").replaceChildren(el("div", { className: "step" }, [
    el("div", { className: "heart", textContent: "♥" }),
    el("h1", { innerHTML: "Merci, mon <em>cœur</em>" }),
    el("p", { textContent: "Tes réponses sont bien arrivées." }),
  ]));
}

// Les réponses restent en mémoire : « Réessayer » renvoie les mêmes
function failed() {
  $("body").replaceChildren(el("div", { className: "step" }, [
    el("h2", { textContent: "L'envoi n'a pas marché" }),
    el("p", { textContent: "Vérifie ta connexion internet, puis réessaie." }),
  ]));
  $("nav").replaceChildren(el("button", { className: "btn", textContent: "Réessayer", onclick: send }));
}

render();
</script>
</body>
</html>
